name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || yes | sdkmanager --licenses || true

      - name: Prepare code and Build APK
        run: |
          cp tracker.py main.py
          python -c "
          with open('main.py', 'r', encoding='utf-8') as f:
              code = f.read()
          code = code.replace('ft.app(target=main)', 'if hasattr(ft, \"run\"): ft.run(main)\nelse: ft.app(target=main)')
          code = code.replace('flet.app(target=main)', 'if hasattr(flet, \"run\"): flet.run(main)\nelse: flet.app(target=main)')
          with open('main.py', 'w', encoding='utf-8') as f:
              f.write(code)
          "
          echo "y" | flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/*.apk
